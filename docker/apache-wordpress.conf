# WordPress 公式 Docker イメージ（Apache 同梱版）に注入する追加設定。
# /var/www/html では .htaccess を有効化しないとパーマリンクが 404 になるため、
# 既定の AllowOverride None を上書きして AllowOverride All にする。
# mod_rewrite 自体はイメージ側ですでに有効化されているが、念のため明示的にロード。

<IfModule !mod_rewrite.c>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

<Directory /var/www/html/>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
